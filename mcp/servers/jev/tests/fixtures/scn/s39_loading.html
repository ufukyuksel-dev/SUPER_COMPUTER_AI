<!doctype html><html lang="en"><head><meta charset="utf-8"><title>S39</title><style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style></head><body>
<header><div role="progressbar" style="width:40px;height:10px;background:#ccc">.</div></header>
<div hidden>Loading…</div><span class="sr">Loading results</span>
<div role="progressbar" aria-valuenow="40" style="width:100px;height:10px;background:#9c9">40%</div>
<div role="tab">Cheapest <span role="progressbar" aria-label="Fetching results" style="display:inline-block;width:16px;height:16px;background:#ccc"></span></div>
<button id="go">Search</button>
<main id="main" style="min-height:400px"></main>
<script>
const stuck = location.search.includes('stuck');
document.getElementById('go').onclick = () => {
  const m = document.getElementById('main');
  m.setAttribute('aria-busy', 'true');
  m.innerHTML = '<div style="font-size:20px;padding:20px">Loading results</div>';
  if (!stuck) setTimeout(() => {
    m.removeAttribute('aria-busy');
    m.innerHTML = '<ul><li><a href="ok.html#a">Result A ₺9,000</a></li><li><a href="ok.html#b">Result B ₺8,000</a></li>' +
                  '<li><a href="ok.html#c">Result C ₺10,000</a></li></ul>';
  }, 1500);
};
</script></body></html>
