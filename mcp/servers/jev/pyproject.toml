[project]
name = "jev"
version = "0.1.0"
description = "Jev picks, Chrome clicks — minimal Jev-powered browser control"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.63.0",
    "typesafe-sdk==0.7.1",
    "mcp==2.2.0",
    "rapidfuzz",
    "python-dotenv",
]

[project.scripts]
jev = "jev.cli:main"
jev-mcp = "jev.mcp_server:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
