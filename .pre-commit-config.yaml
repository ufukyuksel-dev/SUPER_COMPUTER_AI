# Enable once per clone: pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: validate
        name: public-safety validation
        entry: python3 scripts/validate.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-skills
        name: skill and role validation (working tree)
        entry: python scripts/skills/validate_skills.py --layer0 require
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        pass_filenames: false
        files: ^(skills|agents|instructions/global|third_party/openai-skill-creator)/
