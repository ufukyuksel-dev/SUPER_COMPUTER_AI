name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]   # 3.9 = macOS system Python floor for the stdlib scripts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Public-safety validation
        run: python scripts/validate.py
      - name: Skill and role validation (Layer 0 = vendored, checksum-verified skill-creator)
        run: python scripts/skills/validate_skills.py --layer0 require
      - name: Tests
        run: python -m pytest tests tools/dataset-collector/tests -q

  premiere-pro:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]   # package.json engines: node >= 20
    defaults:
      run:
        working-directory: mcp/servers/premiere-pro
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test

  google-ads:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/servers/google-ads
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv run --locked --python 3.14 pytest -q   # hermetic: fake IDs, temp config, no network

  jev:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/servers/jev
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium chrome   # tests use the "chrome" channel
      - run: uv run --locked pytest -q -rfs   # live Jev tests skip: no TYPESAFE_API_KEY in CI

  adb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/servers/adb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew test --no-daemon   # hermetic: no device; state under build/test-state
